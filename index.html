
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
            line-height: 1.6;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hello, World!</h1>

        <h2>Welcome to My First Website</h2>

        <p>My name is Sasanka.</p>

        <p>I am learning HTML, CSS, Git and GitHub.</p>

        <p>This is my first practice project.</p>

        <button onclick="showMessage()">Click Me</button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Congratulations! Your website is working.";
        }
    </script>

</body>

</html>
